<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Public Chat - USA Room</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .chat-container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .stats-bar { display: flex; justify-content: space-between; background: #2c3e50; color: white; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        .stat-item span { color: #2ecc71; font-weight: bold; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; background: #e1ffc7; word-break: break-word; }
        .bot-message { background: #e2f0cb; border-left: 4px solid #ff4d94; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Global Public Chat</h2>
        
        <div class="stats-bar">
            <div class="stat-item">🟢 Online Members: <span id="onlineCount">1,024</span></div>
            <div class="stat-item">👩 Active Girls: <span id="girlsCount">98</span></div>
        </div>

        <div class="chat-box" id="chatBox"></div>
        
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Your Name..." style="max-width: 130px;">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function sendMessage() {
            const username = document.getElementById('usernameInput').value || "Guest_" + Math.floor(Math.random()*900+100);
            const message = document.getElementById('messageInput').value;
            
            if (message.trim() !== "") {
                socket.emit('chat_message', { username, message });
                document.getElementById('messageInput').value = "";
            }
        }

        socket.on('chat_message', function(data) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            if(data.isBot) {
                msgDiv.classList.add('bot-message');
            }
            msgDiv.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('update_stats', function(data) {
            document.getElementById('onlineCount').innerText = data.onlineCount.toLocaleString();
            document.getElementById('girlsCount').innerText = data.girlsCount;
        });
    </script>
</body>
</html>
